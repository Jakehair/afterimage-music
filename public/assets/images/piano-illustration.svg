<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-piano" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090a0f" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <radialGradient id="glow-piano" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg-grad-piano)" />
  <circle cx="400" cy="280" r="280" fill="url(#glow-piano)" />

  <!-- Grand Piano Contour -->
  <g transform="translate(100, 120)">
    <!-- Piano Body & Lid -->
    <path d="M 120 280 C 120 180, 240 100, 420 100 C 520 100, 580 150, 580 250 L 580 340 L 120 340 Z" fill="#18181b" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2" />
    <path d="M 140 100 L 460 20 L 480 30 L 160 110 Z" fill="url(#gold-grad)" opacity="0.8" />
    <line x1="280" y1="65" x2="290" y2="180" stroke="#f59e0b" stroke-width="3" />

    <!-- Keyboard Bed -->
    <rect x="100" y="340" width="500" height="60" rx="6" fill="#111827" stroke="#475569" stroke-width="2" />
    
    <!-- White Keys -->
    <g fill="#f8fafc" stroke="#cbd5e1" stroke-width="1">
      <rect x="110" y="342" width="22" height="56" rx="2" />
      <rect x="134" y="342" width="22" height="56" rx="2" />
      <rect x="158" y="342" width="22" height="56" rx="2" />
      <rect x="182" y="342" width="22" height="56" rx="2" />
      <rect x="206" y="342" width="22" height="56" rx="2" />
      <rect x="230" y="342" width="22" height="56" rx="2" />
      <rect x="254" y="342" width="22" height="56" rx="2" />
      <rect x="278" y="342" width="22" height="56" rx="2" />
      <rect x="302" y="342" width="22" height="56" rx="2" />
      <rect x="326" y="342" width="22" height="56" rx="2" />
      <rect x="350" y="342" width="22" height="56" rx="2" />
      <rect x="374" y="342" width="22" height="56" rx="2" />
      <rect x="398" y="342" width="22" height="56" rx="2" />
      <rect x="422" y="342" width="22" height="56" rx="2" />
      <rect x="446" y="342" width="22" height="56" rx="2" />
      <rect x="470" y="342" width="22" height="56" rx="2" />
      <rect x="494" y="342" width="22" height="56" rx="2" />
      <rect x="518" y="342" width="22" height="56" rx="2" />
      <rect x="542" y="342" width="22" height="56" rx="2" />
      <rect x="566" y="342" width="22" height="56" rx="2" />
    </g>

    <!-- Black Keys -->
    <g fill="#090a0f">
      <rect x="125" y="342" width="14" height="36" rx="1" />
      <rect x="149" y="342" width="14" height="36" rx="1" />
      <rect x="197" y="342" width="14" height="36" rx="1" />
      <rect x="221" y="342" width="14" height="36" rx="1" />
      <rect x="245" y="342" width="14" height="36" rx="1" />
      <rect x="293" y="342" width="14" height="36" rx="1" />
      <rect x="317" y="342" width="14" height="36" rx="1" />
      <rect x="365" y="342" width="14" height="36" rx="1" />
      <rect x="389" y="342" width="14" height="36" rx="1" />
      <rect x="413" y="342" width="14" height="36" rx="1" />
      <rect x="461" y="342" width="14" height="36" rx="1" />
      <rect x="485" y="342" width="14" height="36" rx="1" />
      <rect x="533" y="342" width="14" height="36" rx="1" />
      <rect x="557" y="342" width="14" height="36" rx="1" />
    </g>

    <!-- Pianist Silhouette Playing at Grand Piano -->
    <g fill="#38bdf8" opacity="0.85">
      <!-- Head -->
      <circle cx="210" cy="200" r="28" />
      <!-- Torso / Posture -->
      <path d="M 195 235 C 190 280, 220 340, 250 345 L 260 330 C 240 280, 225 240, 220 235 Z" />
      <!-- Arms reaching toward keys -->
      <path d="M 215 250 L 320 335 L 340 330 L 235 240 Z" />
      <path d="M 210 260 L 280 340 L 295 338 L 225 250 Z" />
    </g>
  </g>

  <!-- Title Badge -->
  <g transform="translate(400, 530)" text-anchor="middle">
    <rect x="-180" y="-30" width="360" height="48" rx="24" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" />
    <text y="2" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="1">DEVAN AT THE PIANO</text>
    <text y="16" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Classical Technique &amp; Performance</text>
  </g>
</svg>
