<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-studio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="40%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#090a0f" />
    </linearGradient>
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <radialGradient id="glow-studio" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg-grad-studio)" />
  <circle cx="400" cy="280" r="300" fill="url(#glow-studio)" />

  <!-- Studio Desk Setup -->
  <g transform="translate(100, 100)">
    <!-- Acoustic Wall Panels -->
    <g fill="#111827" stroke="#059669" stroke-opacity="0.3" stroke-width="1.5">
      <rect x="20" y="20" width="60" height="120" rx="4" />
      <rect x="90" y="20" width="60" height="120" rx="4" />
      <rect x="450" y="20" width="60" height="120" rx="4" />
      <rect x="520" y="20" width="60" height="120" rx="4" />
    </g>

    <!-- Studio Monitors (Speakers) -->
    <g fill="#0f172a" stroke="#10b981" stroke-width="2">
      <!-- Left Monitor -->
      <rect x="60" y="160" width="70" height="110" rx="8" />
      <circle cx="95" cy="190" r="14" fill="#1e293b" />
      <circle cx="95" cy="235" r="24" fill="#1e293b" stroke="#34d399" stroke-width="1.5" />
      <circle cx="95" cy="235" r="8" fill="#10b981" />

      <!-- Right Monitor -->
      <rect x="470" y="160" width="70" height="110" rx="8" />
      <circle cx="505" cy="190" r="14" fill="#1e293b" />
      <circle cx="505" cy="235" r="24" fill="#1e293b" stroke="#34d399" stroke-width="1.5" />
      <circle cx="505" cy="235" r="8" fill="#10b981" />
    </g>

    <!-- Center Ultrawide Screen with DAW Timeline -->
    <rect x="150" y="130" width="300" height="160" rx="8" fill="#030712" stroke="#38bdf8" stroke-width="2" />
    <!-- Screen Content: DAW Tracks & Waveforms -->
    <g transform="translate(155, 135)">
      <!-- Top Bar -->
      <rect x="0" y="0" width="290" height="18" fill="#1e293b" rx="4" />
      <circle cx="12" cy="9" r="4" fill="#ef4444" />
      <circle cx="26" cy="9" r="4" fill="#f59e0b" />
      <circle cx="40" cy="9" r="4" fill="#10b981" />
      <!-- Waveform Tracks -->
      <rect x="5" y="24" width="280" height="24" rx="3" fill="#0f172a" />
      <path d="M 10 36 Q 40 26 70 36 T 130 36 T 190 36 T 250 36 T 280 36" stroke="#38bdf8" stroke-width="2" fill="none" />
      <rect x="5" y="52" width="280" height="24" rx="3" fill="#0f172a" />
      <path d="M 10 64 Q 30 54 60 64 T 120 64 T 180 64 T 240 64 T 280 64" stroke="#818cf8" stroke-width="2" fill="none" />
      <rect x="5" y="80" width="280" height="24" rx="3" fill="#0f172a" />
      <path d="M 10 92 Q 50 82 90 92 T 170 92 T 230 92 T 280 92" stroke="#34d399" stroke-width="2" fill="none" />
      <rect x="5" y="108" width="280" height="24" rx="3" fill="#0f172a" />
      <path d="M 10 120 Q 35 110 75 120 T 155 120 T 225 120 T 280 120" stroke="#f472b6" stroke-width="2" fill="none" />
      <!-- Playhead Red Line -->
      <line x1="140" y1="20" x2="140" y2="145" stroke="#f87171" stroke-width="1.5" />
    </g>

    <!-- Desk Surface -->
    <rect x="40" y="295" width="520" height="25" rx="4" fill="#18181b" stroke="#334155" stroke-width="1.5" />

    <!-- Studio Desk Silhouette of Devan Composing with Headphones -->
    <g fill="#34d399" opacity="0.85">
      <!-- Head with Headphones -->
      <circle cx="300" cy="245" r="26" />
      <!-- Headphones band and cups -->
      <path d="M 276 245 C 276 220 324 220 324 245" stroke="#f8fafc" stroke-width="5" fill="none" />
      <rect x="272" y="235" width="8" height="20" rx="3" fill="#f8fafc" />
      <rect x="320" y="235" width="8" height="20" rx="3" fill="#f8fafc" />
      <!-- Torso -->
      <path d="M 270 280 C 265 315 285 365 330 365 C 345 365 340 315 330 280 Z" />
      <!-- Hands on MIDI Keyboard -->
      <path d="M 270 295 L 250 330 L 290 335 L 295 305 Z" />
      <path d="M 325 295 L 345 330 L 310 335 L 310 305 Z" />
    </g>

    <!-- MIDI Keyboard Controller on Desk -->
    <rect x="180" y="325" width="240" height="40" rx="4" fill="#0f172a" stroke="#059669" stroke-width="1.5" />
    <!-- White Keys on MIDI controller -->
    <g fill="#e2e8f0">
      <rect x="190" y="328" width="12" height="34" rx="1" />
      <rect x="204" y="328" width="12" height="34" rx="1" />
      <rect x="218" y="328" width="12" height="34" rx="1" />
      <rect x="232" y="328" width="12" height="34" rx="1" />
      <rect x="246" y="328" width="12" height="34" rx="1" />
      <rect x="260" y="328" width="12" height="34" rx="1" />
      <rect x="274" y="328" width="12" height="34" rx="1" />
      <rect x="288" y="328" width="12" height="34" rx="1" />
      <rect x="302" y="328" width="12" height="34" rx="1" />
      <rect x="316" y="328" width="12" height="34" rx="1" />
      <rect x="330" y="328" width="12" height="34" rx="1" />
      <rect x="344" y="328" width="12" height="34" rx="1" />
      <rect x="358" y="328" width="12" height="34" rx="1" />
      <rect x="372" y="328" width="12" height="34" rx="1" />
      <rect x="386" y="328" width="12" height="34" rx="1" />
      <rect x="400" y="328" width="12" height="34" rx="1" />
    </g>
    <!-- Black Keys -->
    <g fill="#090a0f">
      <rect x="199" y="328" width="8" height="20" />
      <rect x="213" y="328" width="8" height="20" />
      <rect x="241" y="328" width="8" height="20" />
      <rect x="255" y="328" width="8" height="20" />
      <rect x="269" y="328" width="8" height="20" />
      <rect x="297" y="328" width="8" height="20" />
      <rect x="311" y="328" width="8" height="20" />
      <rect x="339" y="328" width="8" height="20" />
      <rect x="353" y="328" width="8" height="20" />
      <rect x="367" y="328" width="8" height="20" />
      <rect x="395" y="328" width="8" height="20" />
    </g>
  </g>

  <!-- Title Badge -->
  <g transform="translate(400, 530)" text-anchor="middle">
    <rect x="-180" y="-30" width="360" height="48" rx="24" fill="#022c22" stroke="#10b981" stroke-width="1.5" />
    <text y="2" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="1">DEVAN AT THE STUDIO DESK</text>
    <text y="16" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11">Film Composition &amp; Music Technology</text>
  </g>
</svg>
